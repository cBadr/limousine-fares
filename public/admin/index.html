<!doctype html>
<html lang="ar" dir="rtl" data-page="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم — قائمة الأسعار</title>
  <meta name="theme-color" content="#141d36">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/vendor/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="is-loading">

  <!-- ============ login ============ -->
  <section class="login" id="login" hidden>
    <div class="login-art" aria-hidden="true">
      <div class="login-art-inner">
        <span class="brand-mark login-mark" id="login-mark"></span>
        <p class="login-quote">كل سعر في مكانه،<br>وكل تعديل محسوب.</p>
        <p class="login-quote-sub">لوحة إدارة قائمة أسعار التشغيل</p>
      </div>
    </div>
    <div class="login-panel">
      <form class="login-form" id="login-form" novalidate>
        <h1>تسجيل دخول الإدارة</h1>
        <p class="login-lead">هذه المنطقة مخصّصة للأدمن فقط. أدخل بيانات حسابك للمتابعة.</p>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input class="input" id="username" name="username" autocomplete="username" required dir="ltr">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required dir="ltr">
        </div>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">دخول</button>
        <a class="login-back" href="/" id="login-back"></a>
      </form>
    </div>
  </section>

  <!-- ============ app ============ -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <span class="brand-mark" id="side-mark"></span>
        <div>
          <strong id="side-brand"></strong>
          <span>لوحة التحكم</span>
        </div>
      </div>
      <nav class="side-nav" id="side-nav" aria-label="أقسام لوحة التحكم"></nav>
      <div class="side-foot">
        <a class="side-link" href="/" target="_blank" rel="noopener" id="view-public"></a>
        <div class="side-user">
          <span class="avatar" id="avatar"></span>
          <span class="side-user-name" id="user-name"></span>
          <button class="icon-btn" type="button" id="theme-btn"></button>
          <button class="icon-btn" type="button" id="logout-btn" aria-label="تسجيل الخروج" title="تسجيل الخروج"></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" type="button" id="menu-toggle" aria-label="القائمة" aria-expanded="false" aria-controls="sidebar"></button>
        <div class="topbar-title">
          <h1 id="view-title"></h1>
          <p id="view-sub"></p>
        </div>
        <div class="publish-bar" id="publish-bar" data-state="clean">
          <span class="publish-status" id="publish-status" aria-live="polite"></span>
          <button class="btn btn-ghost btn-sm" type="button" id="discard-btn"></button>
          <button class="btn btn-brass" type="button" id="publish-btn"></button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="boot" id="boot" aria-hidden="true"><span></span></div>

  <script src="/assets/common.js" defer></script>
  <script src="/admin/cleanup.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
