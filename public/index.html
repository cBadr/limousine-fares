<!doctype html>
<html lang="ar" dir="rtl" data-page="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قائمة أسعار الليموزين</title>
  <meta name="description" content="قائمة أسعار تشغيل الليموزين للمطارات والمحافظات — بحث سريع وطباعة وتصدير.">
  <meta name="theme-color" content="#141d36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#zones">تخطَّ إلى الأسعار</a>

  <header class="masthead">
    <div class="wrap">
      <div class="bar">
        <div class="brand">
          <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
          <span class="brand-name" id="brand-name">&nbsp;</span>
        </div>
        <div class="bar-tools">
          <button class="icon-btn band-btn" id="zoom-btn" type="button"></button>
          <button class="icon-btn band-btn" id="theme-btn" type="button"></button>
        </div>
      </div>

      <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow">تعريفة التشغيل الرسمية</p>
          <h1 id="page-title">قائمة الأسعار</h1>
          <p class="subtitle" id="page-subtitle"></p>
          <dl class="facts" id="facts"></dl>
        </div>
        <aside class="ticket" aria-label="تاريخ سريان الأسعار">
          <span class="ticket-label">سارية اعتباراً من</span>
          <strong class="ticket-date" id="effective-date">—</strong>
          <span class="ticket-rule" aria-hidden="true"></span>
          <span class="ticket-meta" id="updated-at"></span>
        </aside>
      </div>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap controls-inner">
      <div class="search">
        <label class="sr-only" for="q">ابحث عن منطقة أو وجهة</label>
        <span class="search-icon" id="search-icon"></span>
        <input class="search-input" id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="ابحث عن وجهة… التجمع، مارينا، شرم">
        <button class="search-clear" id="search-clear" type="button" aria-label="مسح البحث" hidden></button>
      </div>

      <div class="segmented vehicle-switch" id="vehicle-switch" role="group" aria-label="فئة السيارة"></div>

      <div class="actions">
        <button class="btn print-btn" id="print-btn" type="button"></button>
        <div class="menu-wrap">
          <button class="btn menu-btn" id="export-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu"></button>
          <div class="menu" id="export-menu" role="menu" hidden>
            <button role="menuitem" type="button" data-export="print"></button>
            <button role="menuitem" type="button" data-export="xlsx"></button>
            <button role="menuitem" type="button" data-export="csv"></button>
            <button role="menuitem" type="button" data-export="pdf"></button>
          </div>
        </div>
      </div>
    </div>

    <nav class="wrap chips-wrap" aria-label="المناطق">
      <div class="chips" id="chips"></div>
      <button class="chips-nav prev" type="button" aria-label="المناطق السابقة" tabindex="-1"></button>
      <button class="chips-nav next" type="button" aria-label="مناطق أخرى" tabindex="-1"></button>
    </nav>
  </div>

  <main class="wrap content" id="main">
    <div class="print-head" aria-hidden="true">
      <div><strong id="print-brand"></strong><span id="print-title"></span></div>
      <div id="print-meta"></div>
    </div>

    <div class="list-head">
      <p class="result-line" id="result-line" aria-live="polite"></p>
      <button class="btn btn-ghost btn-sm" id="toggle-all" type="button"></button>
    </div>

    <div id="zones" class="zones" tabindex="-1">
      <div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
    </div>

    <section class="zone terms" id="terms" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span id="footer-brand"></span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span id="footer-note">الأسعار قابلة للتعديل</span>
      <a class="footer-admin" href="/admin" id="admin-link"></a>
    </div>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="العودة لأعلى" hidden></button>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

  <script src="/vendor/xlsx.full.min.js" defer></script>
  <script src="/assets/common.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
